<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#c4342a">
<meta property="og:title" content="Caccia alla Pizza">
<meta property="og:description" content="Mangia tutte le pizze e scappa dagli ananas. Batti il mio record!">
<meta property="og:image" content="https://pusca.github.io/caccia-alla-pizza/og.png">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Caccia alla Pizza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: una sola schermata a tutta altezza: intestazione, forno col labirinto, croce direzionale sotto il pollice. Tovaglia a quadri intorno. */
:root{
  --red:#c4342a; --red-2:#d4483d; --cloth:#fbf4e8; --oven:#1f1512; --oven-2:#2b1d18;
  --basil:#2f6b3a; --basil-lt:#79c286; --cheese:#ffcf4d; --ink:#2a120e;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background-color:var(--red);
  background-image:conic-gradient(var(--red) 25%,var(--red-2) 0 50%,var(--red) 0 75%,var(--red-2) 0);
  background-size:44px 44px;
  color:var(--cloth);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.app{
  height:100%;box-sizing:border-box;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 12px;
}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.55rem;line-height:1;margin:0;letter-spacing:.01em;text-shadow:0 2px 0 var(--ink)}
.stats{display:flex;align-items:center;gap:12px;font-weight:800;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.stat small{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.stat b{font-family:var(--display);font-weight:400;font-size:1.25rem}
.lives{display:flex;gap:3px}
.face{display:inline-block;background-image:var(--sheet);background-size:400% 100%;background-position:0 0;background-repeat:no-repeat}
.lives .face{width:26px;height:26px}
.mute{background:var(--oven);color:var(--cloth);border:0;border-radius:10px;width:36px;height:36px;font-size:1rem;cursor:pointer}
.mute:focus-visible,.dir:focus-visible,.cta:focus-visible{outline:3px solid var(--cheese);outline-offset:2px}

.board{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none}
canvas{display:block;border-radius:14px;background:var(--oven);box-shadow:0 0 0 4px var(--oven-2),0 10px 30px rgba(40,8,4,.45);touch-action:none}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px}
.card{
  background:var(--cloth);color:var(--ink);border-radius:20px;padding:22px 20px 20px;max-width:310px;width:100%;
  text-align:center;box-shadow:0 14px 40px rgba(30,6,3,.5);display:flex;flex-direction:column;align-items:center;gap:10px;
}
.card .face{width:120px;height:120px;filter:drop-shadow(0 4px 0 var(--ink))}
.card h2{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.05;margin:0;color:var(--red);text-wrap:balance}
.card p{margin:0;font-size:.95rem;line-height:1.4;text-wrap:pretty}
.card .big{font-family:var(--display);font-size:2.6rem;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;text-align:left;font-size:.9rem;align-items:center}
.legend span:nth-child(odd){font-size:1.3rem;text-align:center}
.cta{
  margin-top:4px;font-family:var(--display);font-size:1.35rem;color:var(--cloth);background:var(--basil);
  border:0;border-radius:14px;padding:12px 30px;cursor:pointer;box-shadow:0 4px 0 #1d4425;
}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 #1d4425}
.hint{font-size:.78rem;opacity:.7}

.pad{display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(3,56px);gap:6px;justify-content:center;flex:none}
.dir{
  border:0;border-radius:16px;background:var(--oven);color:var(--cheese);font-size:1.5rem;cursor:pointer;
  box-shadow:0 4px 0 #0f0907;touch-action:none;
}
.dir.on{background:var(--oven-2);transform:translateY(3px);box-shadow:0 1px 0 #0f0907}
.dir[data-d="up"]{grid-column:2;grid-row:1}
.dir[data-d="left"]{grid-column:1;grid-row:2}
.dir[data-d="right"]{grid-column:3;grid-row:2}
.dir[data-d="down"]{grid-column:2;grid-row:3}
.keys{display:none;text-align:center;font-size:.85rem;opacity:.85}
@media (hover:hover) and (pointer:fine){ .pad{display:none} .keys{display:block} }
@media (max-height:640px){ .pad{grid-template-rows:repeat(3,46px);grid-template-columns:repeat(3,60px)} h1{font-size:1.25rem} }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Caccia<br>alla Pizza</h1>
    <div class="stats">
      <div class="lives" id="lives" aria-label="Vite"></div>
      <div class="stat"><small>Punti</small><b id="score">0</b></div>
      <div class="stat"><small>Record</small><b id="best">0</b></div>
      <button class="mute" id="mute" aria-label="Audio">🔊</button>
    </div>
  </header>

  <div class="board" id="board">
    <canvas id="cv"></canvas>
    <div class="overlay" id="ov">
      <div class="card" id="card"></div>
    </div>
  </div>

  <div class="pad" id="pad">
    <button class="dir" data-d="up" aria-label="Su">▲</button>
    <button class="dir" data-d="left" aria-label="Sinistra">◀</button>
    <button class="dir" data-d="right" aria-label="Destra">▶</button>
    <button class="dir" data-d="down" aria-label="Giù">▼</button>
  </div>
  <div class="keys">Frecce o WASD per muoverti · P per la pausa</div>
</div>

document.documentElement.style.setProperty('--sheet', `url(${FACE_SRC})`);
const MAP = [
  "###############",
  "#......#......#",
  "#o##.#.#.#.##o#",
  "#....#...#....#",
  "##.#.##.##.#.##",
  "#..#.......#..#",
  "#.###.#H#.###.#",
  "#.....#G#.....#",
  "###.#.#G#.#.###",
  "#...#.....#...#",
  "#.###.###.###.#",
  "#.............#",
  "#.##.#####.##.#",
  "#o.#...P...#.o#",
  "##.#.#.#.#.#.##",
  "#....#...#....#",
  "#.####.#.####.#",
  "#.............#",
  "###############"
];
const COLS = MAP[0].length, ROWS = MAP.length;
const DIRS = {up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
const DLIST = Object.values(DIRS);

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const board = document.getElementById('board');
const $ = id => document.getElementById(id);
const face = new Image(); face.src = FACE_SRC;

let T = 20, DPR = 1, wallLayer = null, sprites = {};
let pizzas, playerStart, ghostStarts = [];
let S; // stato partita
let best = 0;
try { best = +localStorage.getItem('pizza_best') || 0 } catch(e){}

function isWall(x,y){ if(x<0||y<0||x>=COLS||y>=ROWS) return true; return MAP[y][x]==='#' }
function blockedFor(x,y,ghost){ if(isWall(x,y)) return true; const c=MAP[y][x]; return !ghost && (c==='G'||c==='H') }

function parse(){
  pizzas = new Map(); ghostStarts = [];
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const c = MAP[y][x];
    if(c==='.') pizzas.set(x+','+y,'p');
    if(c==='o') pizzas.set(x+','+y,'o');
    if(c==='P') playerStart = {x,y};
    if(c==='H'||c==='G') ghostStarts.push({x,y});
  }
}

/* ---------- sprite ---------- */
function mk(size, draw){ const c=document.createElement('canvas'); c.width=c.height=Math.max(2,Math.round(size)); draw(c.getContext('2d'), c.width); return c }
function emojiSprite(ch, size, tint){
  return mk(size, (g,s)=>{
    g.textAlign='center'; g.textBaseline='middle'; g.font = Math.round(s*0.82)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.fillText(ch, s/2, s/2+s*0.04);
    if(tint){ g.globalCompositeOperation='source-atop'; g.fillStyle=tint; g.fillRect(0,0,s,s) }
  });
}
function buildSprites(){
  const px = T*DPR;
  sprites.pizza = mk(px*0.62, (g,s)=>{
    const r=s/2;
    g.fillStyle='#d98a3a'; g.beginPath(); g.arc(r,r,r*0.98,0,7); g.fill();
    g.fillStyle='#ffd45e'; g.beginPath(); g.arc(r,r,r*0.74,0,7); g.fill();
    g.fillStyle='#c8322a';
    [[0.62,0.38],[0.36,0.6],[0.64,0.66]].forEach(([a,b])=>{g.beginPath();g.arc(s*a,s*b,r*0.2,0,7);g.fill()});
    g.fillStyle='#3d8a49'; g.beginPath(); g.arc(s*0.38,s*0.36,r*0.11,0,7); g.fill();
  });
  sprites.chili = emojiSprite('🌶️', px*1.0);
  sprites.ananas = emojiSprite('🍍', px*1.25);
  sprites.scared = emojiSprite('🍍', px*1.25, 'rgba(70,120,255,.62)');
  sprites.blink  = emojiSprite('🍍', px*1.25, 'rgba(255,255,255,.75)');
  sprites.ghost  = emojiSprite('👀', px*0.8);
}
function buildWalls(){
  wallLayer = document.createElement('canvas'); wallLayer.width=cv.width; wallLayer.height=cv.height;
  const g = wallLayer.getContext('2d'), k=T*DPR;
  g.fillStyle='#1f1512'; g.fillRect(0,0,wallLayer.width,wallLayer.height);
  const pad = k*0.14;
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(!isWall(x,y)) continue;
    // ogni muro si allarga verso i vicini, così i blocchi si saldano
    const l = isWall(x-1,y)?0:pad, r = isWall(x+1,y)?0:pad, t = isWall(x,y-1)?0:pad, b = isWall(x,y+1)?0:pad;
    g.fillStyle='#2f6b3a';
    g.fillRect(x*k+l, y*k+t, k-l-r, k-t-b);
    g.fillStyle='#79c286';
    const e = Math.max(1,k*0.07);
    if(t) g.fillRect(x*k+l, y*k+t, k-l-r, e);
    if(l) g.fillRect(x*k+l, y*k+t, e, k-t-b);
  }
  // porta della casa degli ananas
  const hx = ghostStarts[0].x;
  g.fillStyle='#ffcf4d'; g.fillRect(hx*k+k*0.15, 6*k+k*0.06, k*0.7, Math.max(2,k*0.08));
}

function resize(){
  const w = board.clientWidth, h = board.clientHeight;
  T = Math.max(8, Math.floor(Math.min((w-8)/COLS, (h-8)/ROWS)));
  DPR = Math.min(3, window.devicePixelRatio||1);
  cv.style.width = T*COLS+'px'; cv.style.height = T*ROWS+'px';
  cv.width = Math.round(T*COLS*DPR); cv.height = Math.round(T*ROWS*DPR);
  buildSprites(); buildWalls();
  if(S) draw(0);
}

/* ---------- partita ---------- */
function newGame(){
  parse();
  S = { score:0, lives:3, level:1, mode:'ready', powerT:0, combo:0, deathT:0, pops:[], time:0 };
  resetActors();
  hud();
}
function resetActors(){
  S.p = { x:playerStart.x, y:playerStart.y, dir:null, next:null, face:1, mouth:0 };
  S.g = ghostStarts.map((s,i)=>({ i, x:s.x, y:s.y, sx:s.x, sy:s.y, dir:DIRS.up, wait:0.6+i*2.2, eaten:false }));
  S.powerT = 0;
}
function hud(){
  $('score').textContent = S.score; $('best').textContent = best;
  const L = $('lives'); L.innerHTML='';
  for(let i=0;i<S.lives;i++){ const f=document.createElement('span'); f.className='face'; L.appendChild(f) }
}
function addScore(n){ S.score+=n; if(S.score>best){ best=S.score; try{localStorage.setItem('pizza_best',best)}catch(e){} } hud() }

function step(e, dist, choose, ghost, arrive){
  let guard = 0;
  while(dist>1e-6 && guard++<8){
    const atC = Math.abs(e.x-Math.round(e.x))<1e-6 && Math.abs(e.y-Math.round(e.y))<1e-6;
    if(atC){
      e.x=Math.round(e.x); e.y=Math.round(e.y);
      choose(e);
      if(!e.dir || blockedFor(e.x+e.dir.x, e.y+e.dir.y, ghost)){ if(!ghost) e.dir=null; return }
    }
    const tx = e.dir.x ? (e.dir.x>0 ? Math.floor(e.x)+1 : Math.ceil(e.x)-1) : e.x;
    const ty = e.dir.y ? (e.dir.y>0 ? Math.floor(e.y)+1 : Math.ceil(e.y)-1) : e.y;
    const d = Math.abs(tx-e.x)+Math.abs(ty-e.y), m = Math.min(d,dist);
    e.x += e.dir.x*m; e.y += e.dir.y*m; dist -= m;
    if(m>=d-1e-9){ e.x=tx; e.y=ty; arrive && arrive(e) }
  }
}
function playerChoose(p){
  if(p.next && !blockedFor(p.x+p.next.x, p.y+p.next.y, false)) p.dir = p.next;
}
function eat(p){
  const key = p.x+','+p.y, it = pizzas.get(key);
  if(!it) return;
  pizzas.delete(key);
  p.mouth = 0;
  if(it==='p'){ addScore(10); blip(520+Math.random()*80, .05, 'square', .04) }
  else { addScore(50); S.powerT = Math.max(3.5, 8 - S.level*0.7); S.combo=0; S.g.forEach(g=>{ if(!g.eaten && g.dir) g.dir={x:-g.dir.x,y:-g.dir.y} }); blip(220,.25,'sawtooth',.06); blip(330,.25,'sawtooth',.05,.08) }
  if(pizzas.size===0) levelClear();
}
function ghostChoose(g){
  const ok = d => !blockedFor(g.x+d.x, g.y+d.y, true);
  let list = DLIST.filter(d => ok(d) && !(g.dir && d.x===-g.dir.x && d.y===-g.dir.y));
  if(!list.length) list = DLIST.filter(ok);
  if(!list.length){ g.dir=null; return }
  const p = S.p, rnd = a => a[Math.floor(Math.random()*a.length)];
  const dist2 = (d,tx,ty) => (g.x+d.x-tx)**2 + (g.y+d.y-ty)**2;
  if(S.powerT>0){
    g.dir = Math.random()<0.4 ? rnd(list) : list.reduce((a,b)=> dist2(b,p.x,p.y)>dist2(a,p.x,p.y)?b:a);
    return;
  }
  let tx=p.x, ty=p.y;
  if(g.i===1 && p.dir){ tx = p.x+p.dir.x*3; ty = p.y+p.dir.y*3 }
  if(g.i===2 && Math.hypot(g.x-p.x,g.y-p.y)<5){ tx=1; ty=ROWS-2 }
  const wander = Math.max(0.06, 0.32 - S.level*0.05);
  g.dir = Math.random()<wander ? rnd(list) : list.reduce((a,b)=> dist2(b,tx,ty)<dist2(a,tx,ty)?b:a);
}

function levelClear(){
  S.mode='clear'; blip(660,.12,'square',.05); blip(880,.18,'square',.05,.13);
  setTimeout(()=>{
    S.level++; parse(); resetActors(); S.mode='ready';
    showCard(`<h2>Livello ${S.level}</h2><p>Forno pulito! Gli ananas adesso corrono di più.</p><button class="cta" id="go">Avanti</button>`);
  }, 900);
}
function die(){
  S.mode='dying'; S.deathT=0; S.lives--; hud();
  try{ navigator.vibrate && navigator.vibrate(180) }catch(e){}
  blip(300,.15,'triangle',.07); blip(200,.2,'triangle',.07,.15); blip(120,.35,'triangle',.07,.32);
}
function afterDeath(){
  if(S.lives<=0){
    S.mode='over';
    showCard(`<span class="face"></span><h2>Ananas 1, pizza 0</h2><div class="big">${S.score}</div><p>punti · record ${best}</p><button class="cta" id="go">Rigioca</button>`, ()=>{ newGame(); start() });
  } else { resetActors(); S.mode='ready'; hideCard(); setTimeout(()=>{ if(S.mode==='ready') S.mode='play' }, 700) }
}

function update(dt){
  S.time += dt;
  S.pops = S.pops.filter(o => (o.t+=dt) < 0.9);
  if(S.mode==='dying'){ S.deathT+=dt; if(S.deathT>1.4){ afterDeath() } return }
  if(S.mode!=='play') return;
  const p = S.p;
  // inversione immediata a metà casella
  if(p.dir && p.next && p.next.x===-p.dir.x && p.next.y===-p.dir.y) p.dir = p.next;
  const pSpeed = 5.2 + Math.min(1.2, (S.level-1)*0.15);
  const moving = !!p.dir;
  step(p, pSpeed*dt, playerChoose, false, eat);
  if(S.mode!=='play') return;
  if(p.dir && p.dir.x) p.face = p.dir.x;
  // bocca: si apre avvicinandosi a una pizza, si chiude di colpo quando la mangia
  let want = 0;
  if(p.dir){
    const nx = p.dir.x ? (p.dir.x>0 ? Math.floor(p.x)+1 : Math.ceil(p.x)-1) : p.x;
    const ny = p.dir.y ? (p.dir.y>0 ? Math.floor(p.y)+1 : Math.ceil(p.y)-1) : p.y;
    if(pizzas.has(nx+','+ny)){ const d = Math.abs(nx-p.x)+Math.abs(ny-p.y); want = Math.min(1,(1-d)*1.7+0.15) }
  }
  if(S.powerT>0){ for(const g of S.g){ if(Math.hypot(g.x-p.x,g.y-p.y)<2.2) want = 1 } }
  p.mouth = want > p.mouth ? Math.min(want, p.mouth + dt*9) : want;

  if(S.powerT>0){ S.powerT -= dt; if(S.powerT<=0){ S.powerT=0 } }
  const gBase = Math.min(5.4, 3.9 + (S.level-1)*0.35);
  for(const g of S.g){
    if(g.wait>0){ g.wait-=dt; continue }
    const sp = g.eaten ? 0 : (S.powerT>0 ? 2.6 : gBase);
    step(g, sp*dt, ghostChoose, true);
    if(Math.hypot(g.x-p.x, g.y-p.y) < 0.62){
      if(S.powerT>0){
        S.combo++; const pts = 100*2**S.combo; addScore(pts);
        S.pops.push({x:g.x,y:g.y,txt:'+'+pts,t:0}); blip(880,.08,'square',.06); blip(1320,.12,'square',.05,.07);
        g.x=g.sx; g.y=g.sy; g.dir=DIRS.up; g.wait=3;
      } else { die(); return }
    }
  }
}

/* ---------- disegno ---------- */
function draw(){
  const k = T*DPR;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(wallLayer,0,0);
  ctx.setTransform(k,0,0,k,0,0);
  const t = S.time;
  for(const [key,it] of pizzas){
    const [x,y] = key.split(',').map(Number);
    if(it==='p') ctx.drawImage(sprites.pizza, x+0.19, y+0.19, 0.62, 0.62);
    else { const s = 0.9 + Math.sin(t*6)*0.12; ctx.drawImage(sprites.chili, x+0.5-s/2, y+0.5-s/2, s, s) }
  }
  for(const g of S.g){
    let spr = sprites.ananas;
    if(S.powerT>0) spr = (S.powerT<2 && Math.floor(t*8)%2) ? sprites.blink : sprites.scared;
    const bob = Math.sin(t*9+g.i*2)*0.05;
    ctx.globalAlpha = g.wait>0 && S.mode==='play' ? 0.75 : 1;
    ctx.drawImage(spr, g.x+0.5-0.62, g.y+0.5-0.66+bob, 1.24, 1.24);
    ctx.globalAlpha = 1;
  }
  // giocatore
  const p = S.p;
  ctx.save(); ctx.translate(p.x+0.5, p.y+0.5);
  let sc = 1, rot = 0;
  if(S.mode==='dying'){ const d=Math.min(1,S.deathT/1.2); rot = d*Math.PI*4; sc = 1-d }
  else { rot = (p.dir? (p.dir.x*0.12 + (p.dir.y? Math.sin(t*10)*0.06:0)) : Math.sin(t*2)*0.04) }
  const open = S.mode==='dying' ? 1 : p.mouth;
  const fr = Math.min(3, Math.round(open*3));
  ctx.rotate(rot); ctx.scale(sc, sc);
  if(sc>0.01 && face.complete && face.naturalWidth){
    const fw = face.naturalWidth/4, fh = face.naturalHeight;
    ctx.drawImage(face, fr*fw, 0, fw, fh, -0.78, -0.82, 1.56, 1.56);
  }
  ctx.restore();
  // punti fluttuanti
  ctx.setTransform(1,0,0,1,0,0);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = '800 '+Math.round(k*0.62)+'px Nunito, sans-serif';
  for(const o of S.pops){
    ctx.globalAlpha = 1-o.t/0.9; ctx.fillStyle='#ffcf4d';
    ctx.fillText(o.txt, (o.x+0.5)*k, (o.y+0.2-o.t*0.8)*k);
  }
  ctx.globalAlpha=1;
}

/* ---------- schede ---------- */
let onGo = null;
function showCard(html, cb){
  $('card').innerHTML = html; $('ov').hidden = false; onGo = cb || start;
  const b = $('go'); if(b){ b.onclick = e=>{ e.stopPropagation(); unlockAudio(); onGo() }; setTimeout(()=>b.focus({preventScroll:true}),50) }
}
function hideCard(){ $('ov').hidden = true }
function start(){ hideCard(); if(S.mode==='ready'||S.mode==='paused') S.mode='play' }

/* ---------- input ---------- */
function setDir(name){
  if(!S) return;
  S.p.next = DIRS[name];
  if(S.mode==='ready' && $('ov').hidden) S.mode='play';
}
const KEYS = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
addEventListener('keydown', e=>{
  if(KEYS[e.key]){ e.preventDefault(); unlockAudio(); if(!$('ov').hidden && (S.mode==='ready')){ start() } setDir(KEYS[e.key]) }
  else if((e.key==='p'||e.key==='P') && S){ if(S.mode==='play'){ S.mode='paused'; showCard(`<h2>Pausa</h2><p>Le pizze ti aspettano.</p><button class="cta" id="go">Riprendi</button>`) } else if(S.mode==='paused') start() }
  else if((e.key==='Enter'||e.key===' ') && !$('ov').hidden){ const b=$('go'); if(b){ e.preventDefault(); b.click() } }
});
document.querySelectorAll('.dir').forEach(b=>{
  b.addEventListener('pointerdown', e=>{ e.preventDefault(); unlockAudio(); b.classList.add('on'); setDir(b.dataset.d) });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove('on')));
});
let sw = null;
board.addEventListener('touchstart', e=>{ const t=e.touches[0]; sw={x:t.clientX,y:t.clientY} }, {passive:true});
board.addEventListener('touchmove', e=>{
  if(!sw) return; const t=e.touches[0], dx=t.clientX-sw.x, dy=t.clientY-sw.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<18) return;
  if(e.cancelable) e.preventDefault();
  unlockAudio();
  setDir(Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'));
  sw={x:t.clientX,y:t.clientY};
}, {passive:false});
board.addEventListener('touchend', ()=>{ sw=null });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && S && S.mode==='play'){ S.mode='paused'; showCard(`<h2>Pausa</h2><p>Le pizze ti aspettano.</p><button class="cta" id="go">Riprendi</button>`) } });

/* ---------- audio ---------- */
let AC = null, muted = false;
try{ muted = localStorage.getItem('pizza_mute')==='1' }catch(e){}
$('mute').textContent = muted ? '🔇' : '🔊';
function unlockAudio(){ if(AC||muted) return; try{ AC = new (window.AudioContext||window.webkitAudioContext)() }catch(e){} }
function blip(f,dur,type,vol,delay=0){
  if(muted||!AC) return;
  try{
    const t0 = AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
$('mute').addEventListener('click', ()=>{ muted=!muted; $('mute').textContent = muted?'🔇':'🔊'; try{localStorage.setItem('pizza_mute',muted?'1':'0')}catch(e){} if(!muted) unlockAudio() });

/* ---------- avvio ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  if(S){ update(dt); draw() }
  requestAnimationFrame(loop);
}
new ResizeObserver(resize).observe(board);
newGame(); resize();
showCard(`<span class="face"></span><h2>Caccia alla Pizza</h2>
  <div class="legend"><span>🍕</span><span>Mangiale tutte</span><span>🍍</span><span>Scappa dagli ananas</span><span>🌶️</span><span>Peperoncino: ora scappano loro</span></div>
  <button class="cta" id="go">Gioca</button><div class="hint">Scorri col dito sul labirinto o usa i tasti</div>`);
requestAnimationFrame(loop);
</script>
